[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.15.1"

[[redirects]]
  from = "/quiz"
  to = "/quiz.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/sign-in"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/sign-in/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/coach/sign-in"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/coach/sign-in/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/account/setup"
  to = "/app.html"
  status = 200

[[redirects]]
from = "/account/setup/*"
to = "/app.html"
status = 200

[[redirects]]
from = "/account/confirm"
to = "/app.html"
status = 200

[[redirects]]
from = "/account/confirm/*"
to = "/app.html"
status = 200

[[redirects]]
from = "/account/reset"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/account/reset/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/onboarding/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://api.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://buy.stripe.com; upgrade-insecure-requests"

# Vite emits application modules as same-origin /assets chunks. Sensitive app
# routes therefore do not need inline-script or third-party script allowances.
[[headers]]
  for = "/sign-in"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "private, no-store, max-age=0, must-revalidate"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://api.stripe.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

